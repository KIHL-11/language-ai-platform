name: Cloud foundation CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dq02-fixtures:
    name: DQ-02 synthetic regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixture-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dq02-ci.txt
          python -m pip check
      - name: Shell syntax (no execution)
        run: |
          bash -n scripts/cutover_dictionary_macos.sh
          bash -n scripts/install_personal_app_macos.sh
          bash -n scripts/update_personal_app_macos.sh
      - name: Dictionary migration regression (synthetic only)
        working-directory: backend
        env:
          AI_MODE: mock
        run: |
          python -m pytest -q \
            tests/test_dictionary_import_telemetry.py \
            tests/test_dictionary_release_prepare.py \
            tests/test_dictionary_cutover.py \
            tests/test_dictionary_migration_manifest.py \
            tests/test_personal_app_scripts.py

  backend-full:
    name: Backend full regression (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check
      - name: Full backend suite (real dictionary tests remain opt-in)
        working-directory: backend
        env:
          AI_MODE: mock
          RUN_REAL_DICTIONARY_SMOKE: '0'
        run: python -m pytest -q

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
