name: Agent handoff protocol

on:
  pull_request:
    paths:
      - "scripts/agent_handoff/**"
      - "docs/handoffs/**"
      - "docs/agent-protocol/**"
      - "docs/PHASE8-FEATURE-COMPLETE-TRACKER.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".github/workflows/agent-protocol.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/agent_handoff/**"
      - "docs/handoffs/**"
      - "docs/agent-protocol/**"
      - "docs/PHASE8-FEATURE-COMPLETE-TRACKER.md"
      - "AGENTS.md"
      - ".github/workflows/agent-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff-tools:
    name: Handoff tools (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install "pytest==8.4.2"
      - name: Run handoff tool tests
        run: python -m pytest -q scripts/agent_handoff/tests
      - name: Check handoff records and tracker consistency
        run: python -I scripts/agent_handoff/handoff.py sot-check
